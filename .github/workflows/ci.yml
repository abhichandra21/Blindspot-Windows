name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test Blindspot.slnx
      - name: Build exe and MSI
        shell: pwsh
        run: |
          ./installer/build.ps1 -Version 0.0.1 -Rid win-x64
          ./installer/build.ps1 -Version 0.0.1 -Rid win-arm64

  # Publishes both zips and attaches them to a GitHub release for a version tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build exe, zip and MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') { ./installer/build.ps1 -Version $version -Rid $rid }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item out/*.msi, out/*.zip) --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes
